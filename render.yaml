services:
  - type: web
    name: fitcheck
    runtime: docker
    plan: free
    dockerfilePath: ./Stylest/FITCHECK/Dockerfile
    dockerContext: ./Stylest/FITCHECK
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FITCHECK_APP_PASSWORD
        sync: false
      - key: FITCHECK_SESSION_SECRET
        generateValue: true
